[project]
name = "si-qoi-uq-paper"
version = "0.1.0"
description = "Calibrated parameter-space uncertainty for linear ACE, propagated to silicon properties: analysis code, results and paper"
authors = [{ name = "James R. Kermode" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # ace-jax at the head of ACEsuit/ace-jax#137 (QR ARD evidence), which the ARD fits of the paper use; replace with the
    # release that contains it once #137 is merged
    "ace-jax @ git+https://github.com/ACEsuit/ace-jax@fa1b9aeb9f1b36b6dcd7cc86b344371123e803da",
    "ase>=3.23",
    "matplotlib>=3.8",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "E701", "E702", "E731", "E741", "E401", "B023", "B008", "B905", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
