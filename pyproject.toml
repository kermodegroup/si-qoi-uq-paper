[project]
name = "si-qoi-uq-paper"
version = "0.1.0"
description = "Calibrated parameter-space uncertainty for linear ACE, propagated to silicon properties: analysis code, results and paper"
authors = [{ name = "James R. Kermode" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ace-jax==0.5.2",                          # QR ARD evidence (#137) and the POPS numerics (#141)
    "ase>=3.23",
    "matplotlib>=3.8",
    "numpy",
    "scikit-learn>=1.6",
    "scipy",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "popsregression==0.4.0",
    "pypandoc-binary>=1.17",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "E701", "E702", "E731", "E741", "E401", "B023", "B008", "B905", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
